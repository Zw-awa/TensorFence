name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install source and test dependencies
        run: python -m pip install --upgrade build pip ".[dev]"

      - name: Verify declared NumPy constraint
        run: |
          python - <<'PY'
          import numpy as np

          assert int(np.__version__.split(".", maxsplit=1)[0]) < 2, np.__version__
          print(f"NumPy {np.__version__}")
          PY

      - name: Run tests
        run: python -m pytest

      - name: Build source and wheel distributions
        run: python -m build

      - name: Install wheel in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/tensorfence-wheel"
          "${RUNNER_TEMP}/tensorfence-wheel/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/tensorfence-wheel/bin/python" -m pip install --no-cache-dir dist/*.whl

      - name: Smoke-test installed wheel and HTML report
        run: |
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/tensorfence-wheel/bin/python" \
            "${GITHUB_WORKSPACE}/tests/packaging/wheel_smoke.py"
